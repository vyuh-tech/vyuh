name: Deploy Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: |
          dart pub get --enforce-lockfile

      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.13.1'
      - name: Install deployment tooling
        run: pnpm install --frozen-lockfile
      - name: Make .env file
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const keys = ['TMDB_API_KEY', 'UNSPLASH_ACCESS_KEY', 'UNSPLASH_SECRET_KEY'];
          const content = keys.map(key => `${key}=${JSON.stringify(process.env[key] ?? '')}`).join('\n');
          writeFileSync('apps/vyuh_demo/.env', content + '\n', { mode: 0o600 });
          NODE

      - name: Build web app
        run: |
          cd apps/vyuh_demo
          flutter build web --release --base-href / --wasm

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v3
        with:
          packageManager: pnpm
          wranglerVersion: '4.145.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/vyuh_demo/build/web --project-name=vyuh-demo
