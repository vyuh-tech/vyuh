name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vyuh-package-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
      OAUTH_ACCESS_TOKEN: ${{ secrets.OAUTH_ACCESS_TOKEN }}
      OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Configure existing registry credentials
        run: |
          umask 077
          dart tools/configure_pub_credentials.dart
          dart pub token add https://pub.vyuh.tech --env-var PUB_TOKEN
      - name: Resolve workspace
        run: dart pub get --enforce-lockfile
      - name: Publish unpublished packages in dependency order
        run: dart --packages=.dart_tool/package_config.json tools/melos.dart publish --no-dry-run --yes
