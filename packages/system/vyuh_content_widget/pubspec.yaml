name: vyuh_content_widget
resolution: workspace
description: A widget that can render content from a CMS, relying on the Vyuh ecosystem to provide the content.
version: 2.0.1
homepage: https://vyuh.tech
repository: https://github.com/vyuh-tech/vyuh/tree/main/packages/system/vyuh_content_widget
issue_tracker: https://github.com/vyuh-tech/vyuh/issues

topics:
  - vyuh
  - content
  - widget
  - cms

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  json_annotation: ^4.9.0

  vyuh_core: ^2.0.1
  vyuh_extension_content: ^2.0.1

  material_ui: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
